[tool.poetry]
name = "subscription-service-backend"
version = "0.1.0"
description = ""
authors = ["BlagovestDavidov <bgtscerebrate@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.116.1,<0.117.0"
uvicorn = {extras = ["standard"], version = ">=0.35.0,<0.36.0"}
python-dotenv = ">=1.1.1,<2.0.0"
pydantic-settings = ">=2.10.1,<3.0.0"
prisma = ">=0.15.0,<0.16.0"
fastapi-users = ">=14.0.1,<15.0.0"
python-jose = {extras = ["cryptography"], version = ">=3.5.0,<4.0.0"}
python-json-logger = ">=3.3.0,<4.0.0"
redis = "^6.2.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
httpx = "^0.28.1"
ruff = "^0.12.4"
pre-commit = "^4.2.0"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "ANN", "ASYNC", "B", "C4", "DTZ", "ERA", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "RSE", "RET", "SLF", "TCH", "TID", "YTT"]
ignore = ["D100", "D104", "D105", "D107", "ANN101", "ANN002", "ANN003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

